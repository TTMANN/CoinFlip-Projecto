<!-- HTML -->
<!DOCTYPE html>
<html>

<head>
    <title>Coin Flip</title>
    <link rel="stylesheet" type="text/css" href="CoinCSS.css" />
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Carrois+Gothic+SC&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <div id="Title" class="Middle">
        <h1> Coin Flip</h1>
    </div>
    <br />

    <div id="Button-Container" class="Middle">
        <button id="flip-it" onclick="Flipit()" class="Big"> Flip it</button>
    </div>

    <div id="Coin-Container" class="Middle">
        <div id="Coin">
            <div class="Front Middle">Heads</div>
            <div class="Back Middle">Tails</div>
        </div>
    </div>

    <div id="Result Container" class="Middle">
        <div class="Result"> RESULT </div>
    </div>
    <script src="CoinJavaScript.js"></script>
</body>

</html>
